# NitroSense: turn on the Predator Sense v4 features of the in-kernel acer_wmi driver.
# On Nitro models such as the ANV15-51 this exposes fan RPM (hwmon "acer") and the firmware
# thermal profiles (platform_profile), which power-profiles-daemon then drives. nitrosensed
# reads the fans from here when acpi_call is unavailable (e.g. kernel lockdown=integrity).
#
# force_caps=0x1C26 also enables fan control (hwmon pwm1/pwm2, pwm*_enable 0=max 1=manual
# 2=auto; acer_wmi has it since Linux 6.19) on models whose DMI quirk is not in the kernel yet.
# Bits: WIRELESS(1) BLUETOOTH(2) SET_FUNCTION_MODE(5) PLATFORM_PROFILE(10) HWMON(11) PWM(12).
# The ANV15-51 quirk (cpu/gpu fan, hwmon, platform_profile, pwm) was accepted into the
# platform-drivers-x86 review branch in October 2026; once a kernel ships it, force_caps can go.
options acer_wmi predator_v4=1 force_caps=0x1C26
